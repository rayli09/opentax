[package]
name = "tax-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `tax` binary: agent-first CLI over tax-core/tax-forms/tax-pdf/tax-doc."

[[bin]]
name = "tax"
path = "src/main.rs"

[dependencies]
tax-core = { path = "../tax-core" }
tax-forms = { path = "../tax-forms" }
tax-pdf = { path = "../tax-pdf" }
tax-doc = { path = "../tax-doc" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for `tax forms fetch` (template downloads). Small,
# synchronous, rustls-backed; no async runtime in the binary.
# platform-verifier: verify TLS against the OS trust store (like
# curl) rather than only Mozilla's bundled roots, so downloads also
# work behind corporate TLS-intercepting proxies.
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
lopdf = "0.46"

[lints]
workspace = true
